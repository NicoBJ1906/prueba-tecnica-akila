# Configuración de herramientas del proyecto.
#
# El paquete no se instala: cada ejercicio se ejecuta desde su directorio y las
# pruebas resuelven las rutas por `pythonpath` (ver pytest.ini). Este fichero
# existe solo para dejar fijado el criterio de estilo.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # errores reales: nombres sin definir, imports sin usar
    "E", "W",
    "I",    # orden de imports
    "UP",   # sintaxis anticuada para la versión de Python objetivo
    "B",    # trampas frecuentes (argumentos mutables por defecto, etc.)
    "SIM",  # simplificaciones
    "ARG",  # argumentos sin usar
]
ignore = [
    "E501",   # el largo de línea lo cuida el formateador, no el linter
    "SIM108", # un ternario de cien caracteres se lee peor que un if/else claro
]

[tool.ruff.lint.isort]
# Sin esto, los módulos del propio repositorio se ordenan como si fueran
# dependencias externas.
known-first-party = ["triaje", "dashboard"]

[tool.ruff.lint.per-file-ignores]
# Los dobles de prueba implementan la interfaz de los proveedores: reciben
# `correo` y `config` aunque no los usen, porque el pipeline se los pasa.
"ejercicio1_triaje/tests/test_guardrails.py" = ["ARG002"]
